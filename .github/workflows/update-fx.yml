name: Update FX rates
on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes (GitHub Actions cron floor)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch Wise + CIMB rates
        run: python scripts/fetch-fx.py
      - name: Commit if changed
        run: |
          git config user.name "sgmydash-bot"
          git config user.email "sgmydash-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "Update FX rates [skip ci]"
          git push
